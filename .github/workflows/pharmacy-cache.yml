# Günlük nöbetçi eczane — bitlis.eczaneleri.org → bitlis_pharmacy_cache.json

name: Pharmacy cache daily

on:
  schedule:
    # Bot paylaşımı 00:10 TR. GitHub cron ~saatler gecikebilir; erken UTC
    # slotları 00:10 TR öncesi/civarı en az bir koşuyu hedefler.
    # 00:05 / 00:10 / 00:25 TR → 21:05 / 21:10 / 21:25 UTC (önceki gün)
    - cron: "5 21 * * *"
    - cron: "10 21 * * *"
    - cron: "25 21 * * *"
    # Erken yedekler (gecikmeli runner için)
    - cron: "0 18 * * *"
    - cron: "30 19 * * *"
    - cron: "0 20 * * *"
    - cron: "45 22 * * *"
  workflow_dispatch:
  # GitHub cron'ları saatlerce gecikebiliyor; bot .trigger/ dosyasını
  # yazınca (yalnızca Contents yetkili PAT) workflow anında çalışır.
  push:
    branches: [main]
    paths:
      - ".trigger/**"

permissions:
  contents: write

concurrency:
  group: pharmacy-cache-main
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - uses: actions/setup-python@v6
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Fetch origin
        run: git fetch origin main

      - name: Remote cache kontrol
        id: remote
        env:
          TZ: Europe/Istanbul
        run: python scripts/remote_cache_ready.py

      - name: Scrape eczaneleri.org (3 deneme)
        id: scrape
        if: steps.remote.outputs.ready != 'true'
        env:
          TZ: Europe/Istanbul
        run: |
          for attempt in 1 2 3; do
            echo "Deneme $attempt/3"
            if python github_update_pharmacy_cache.py; then
              echo "updated=true" >> "$GITHUB_OUTPUT"
              exit 0
            fi
            sleep $((12 * attempt))
          done
          echo "updated=false" >> "$GITHUB_OUTPUT"
          if [ "${{ github.event_name }}" = "schedule" ]; then
            echo "::notice::Bugunun eczane verisi henuz yok — sonraki slot denenecek."
            exit 0
          fi
          exit 1

      - name: Verify cache
        if: steps.remote.outputs.ready != 'true' && steps.scrape.outputs.updated == 'true'
        env:
          TZ: Europe/Istanbul
        run: python scripts/verify_pharmacy_cache.py

      - name: Commit and push
        if: steps.remote.outputs.ready != 'true' && steps.scrape.outputs.updated == 'true'
        env:
          TZ: Europe/Istanbul
        run: python scripts/push_pharmacy_cache.py
